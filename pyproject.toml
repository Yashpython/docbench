[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docbench"
version = "0.1.0"
description = "An open evaluation framework and benchmark for LLM document field extraction (invoices, receipts)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "docbench contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pillow>=10.3",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "tenacity>=8.3",
    "datasets>=2.19",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.34"]
azure = ["azure-ai-documentintelligence>=1.0.0", "azure-core>=1.30"]
together = ["together>=1.2"]
all = ["docbench[gemini,openai,anthropic,azure,together]"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
docbench = "docbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docbench"]

[tool.ruff]
line-length = 100
target-version = "py310"
